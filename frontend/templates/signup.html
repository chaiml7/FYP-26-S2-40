<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - StockLens</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=20260814-legal-sidebar">
</head>
<body class="auth-page">

    <div class="auth-container">
        
        <a href="/" class="back-link">
            <span>&larr;</span> Back to Home
        </a>

        <a href="/" class="auth-brand">
            <span class="logo-icon">📈</span>
            <span class="brand-name">StockLens</span>
        </a>

        <div class="card auth-card">
            <div class="auth-header">
                <h2>Create your account</h2>
                <p>Create a StockLens account to organize your market research.</p>
            </div>

            {% if error %}
            <p class="text-danger">{{ error }}</p>
            {% endif %}

            <form action="/signup" method="POST" class="auth-form">
                <fieldset class="signup-plan-picker">
                    <legend class="form-label">Choose your plan</legend>
                    <label class="signup-plan-option">
                        <input type="radio" name="plan" value="free" {% if selected_plan != 'premium' %}checked{% endif %}>
                        <span><strong>Free</strong><small>$0 forever</small></span>
                    </label>
                    <label class="signup-plan-option signup-plan-option-premium">
                        <input type="radio" name="plan" value="premium" {% if selected_plan == 'premium' %}checked{% endif %}>
                        <span><strong>Premium</strong><small>$29 per month</small></span>
                    </label>
                </fieldset>
                <div class="form-group">
                    <label for="firstName" class="form-label">Full Name</label>
                    <input type="text" id="firstName" name="firstName" class="form-control" placeholder="Jane Doe" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="At least 8 characters" required minlength="8">
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" value="accepted" required class="form-checkbox">
                    <label for="terms" class="checkbox-label">
                        I agree to the <a href="/terms" class="text-accent">Terms of Service</a> and <a href="/privacy" class="text-accent">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Create Account and Continue</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login" class="text-accent">Log in</a></p>
            </div>
        </div>
        {% include "/includes/legal_footer.html" %}
    </div>

</body>
</html>
