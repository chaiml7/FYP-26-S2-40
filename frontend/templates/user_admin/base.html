<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}User Admin - StockLens{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="admin-page">
    {% include "/includes/top_navbar.html"%}

    <div class="admin-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="/admin/stocks" class="nav-item {% block nav_stocks %}{% endblock %}">Stock Database</a>
                <a href="/admin/weightages" class="nav-item {% block nav_weights %}{% endblock %}">Default Weightages</a>
                <a href="/admin/sentiment" class="nav-item {% block nav_sentiment %}{% endblock %}">Sentiment Watchlist</a>
                <a href="/admin/reports" class="nav-item {% block nav_reports %}{% endblock %}">Performance Reports</a>
                <a href="/admin/user_management" class="nav-item {% block nav_usermanagement %}{% endblock %}">User Management</a>
                <a href="/admin/roles_management" class="nav-item {% block nav_rolemanagement %}{% endblock %}">Role Management</a>
            </nav>
        </aside>

        <main class="admin-main">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    {% block scripts %}
    {% endblock %}
</body>
</html>
