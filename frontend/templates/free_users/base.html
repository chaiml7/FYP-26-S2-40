<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}User - StockLens{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=20260814-neutral-score">
</head>
<body class="app-page theme-free">
    {% include "/includes/top_navbar.html" %}
    <div class="app-layout">
        <aside class="app-sidebar"> 
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item {% block nav_dashboard %}{% endblock %}">
                    <span class="nav-icon">&#128202;</span> Dashboard
                </a>
                <a href="/user/watchlist" class="nav-item {% block nav_watchlist %}{% endblock %}">
                    <span class="nav-icon">⭐</span> Watchlist
                </a>
                <a href="/user/market_overview" class="nav-item {% block nav_market %}{% endblock %}">
                    <span class="nav-icon">📊</span> Market Overview
                </a>
                <a href="/user/news_social" class="nav-item {% block nav_news %}{% endblock %}">
                    <span class="nav-icon">📰</span> News & Social
                </a>
                <a href="/user/financials" class="nav-item {% block nav_financials %}{% endblock %}">
                    <span class="nav-icon">📉</span> Financials
                </a>
                <a href="/user/feedback" class="nav-item {% block nav_feedback %}{% endblock %}">
                    <span class="nav-icon">&#128172;</span> Feedback
                </a>
            </nav>
            <form action="/billing/checkout" method="post" class="sidebar-billing-action">
                <button type="submit" class="btn btn-primary btn-full">Upgrade to Premium</button>
                <small>Unlock full analysis controls</small>
            </form>
        </aside>

        <main class="app-main">
            <div class="page-content">
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

    {% block scripts %}
    {% endblock %}
</body>
</html>
