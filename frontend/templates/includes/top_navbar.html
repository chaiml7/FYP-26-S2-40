<header class="app-topbar" style="display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; position: relative; z-index: 10;">

    <div class="topbar-brand" style="flex: 1; display: flex; align-items: center; gap: 15px; justify-content: flex-start;">
        <span style="font-weight: bold; font-size: 1.1rem; color: var(--text-main, white);">📈 StockLens</span>
        
        {% if user_role == 'premium_user' %}
            <span class="role-badge role-badge-premium">PREMIUM</span>
        {% elif user_role == 'frontend_admin' %}
            <span class="role-badge role-badge-admin">ADMIN</span>
        {% else %}
            <span class="role-badge role-badge-free">FREE</span>
        {% endif %}
    </div>

    <div class="topbar-center" style="flex: 1; display: flex; justify-content: center;">
        <form id="tickerSearchForm" action="/search" method="GET" class="topbar-search" style="width: 100%; max-width: 450px;" autocomplete="off">
            <span class="search-icon">🔍</span>
            <input type="text" id="tickerSearchInput" name="q" placeholder="Search ticker symbol..." class="form-control search-input bg-darker" style="width: 100%;" autocomplete="off">
            <div id="tickerSearchDropdown" class="ticker-search-dropdown" style="display: none;"></div>
        </form>
    </div>
    
    <div class="topbar-actions" style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 20px; min-width: 0;">

        <!-- Notification Bell -->
        <div style="position: relative;">
            <button class="btn-icon" id="notifBell" onclick="toggleNotifications()" style="position: relative;">
                🔔
                <span id="notifBadge" style="display: none; position: absolute; top: -4px; right: -4px; background: #e24b4a; color: white; font-size: 10px; font-weight: bold; border-radius: 50%; width: 16px; height: 16px; line-height: 16px; text-align: center;"></span>
            </button>

            <!-- Notification Dropdown -->
            <div id="notifDropdown" style="display: none; position: absolute; right: 0; top: 40px; width: 320px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; z-index: 999; overflow: hidden;">
                <div style="padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: 600; font-size: 14px; color: var(--text-main);">Notifications</span>
                    <button onclick="clearNotifications()" style="background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer;">Clear all</button>
                </div>
                <div id="notifList" style="max-height: 300px; overflow-y: auto;">
                    <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Loading notifications...</div>
                </div>
            </div>
        </div>
        
        <div class="user-chip" style="display: flex; align-items: center; gap: 10px;">
            <span class="avatar-sm">{{ user_initial or "U" }}</span>
            <span class="text-sm font-medium">{{ user_email or "StockLens user" }}</span>
        </div>
        
        <a href="/logout" class="btn btn-outline btn-sm">Log Out</a>
    </div>

</header>

<script>
    (() => {
        const form = document.getElementById("tickerSearchForm");
        const input = document.getElementById("tickerSearchInput");
        const dropdown = document.getElementById("tickerSearchDropdown");
        if (!form || !input || !dropdown) return;

        let debounceTimer = null;
        let matches = [];
        let highlightedIndex = -1;

        function closeDropdown() {
            dropdown.style.display = "none";
            dropdown.innerHTML = "";
            matches = [];
            highlightedIndex = -1;
        }

        function updateHighlight() {
            [...dropdown.children].forEach((child, index) => {
                child.classList.toggle("highlighted", index === highlightedIndex);
            });
        }

        function selectStock(stock) {
            closeDropdown();
            window.location = `/stocks/${stock.symbol}/view`;
        }

        function renderDropdown(results) {
            matches = results;
            highlightedIndex = -1;
            dropdown.innerHTML = "";

            if (!results.length) {
                const empty = document.createElement("div");
                empty.className = "ticker-dropdown-empty";
                empty.textContent = "No matching stocks";
                dropdown.appendChild(empty);
                dropdown.style.display = "block";
                return;
            }

            results.forEach((stock) => {
                const item = document.createElement("div");
                item.className = "ticker-dropdown-item";
                item.innerHTML = `<span class="ticker-dropdown-symbol"></span> <span class="ticker-dropdown-name"></span>`;
                item.querySelector(".ticker-dropdown-symbol").textContent = stock.symbol;
                item.querySelector(".ticker-dropdown-name").textContent = stock.company_name || "";
                item.addEventListener("mousedown", (event) => {
                    event.preventDefault();
                    selectStock(stock);
                });
                dropdown.appendChild(item);
            });
            dropdown.style.display = "block";
        }

        async function search(query) {
            try {
                const response = await fetch(`/api/stocks/search?q=${encodeURIComponent(query)}`);
                if (!response.ok) throw new Error("Request failed");
                const data = await response.json();
                renderDropdown(data);
            } catch (error) {
                closeDropdown();
            }
        }

        input.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            const query = input.value.trim();
            if (!query) { closeDropdown(); return; }
            debounceTimer = setTimeout(() => search(query), 200);
        });

        input.addEventListener("keydown", (event) => {
            if (!matches.length) return;
            if (event.key === "ArrowDown") {
                event.preventDefault();
                highlightedIndex = Math.min(highlightedIndex + 1, matches.length - 1);
                updateHighlight();
            } else if (event.key === "ArrowUp") {
                event.preventDefault();
                highlightedIndex = Math.max(highlightedIndex - 1, 0);
                updateHighlight();
            } else if (event.key === "Enter") {
                event.preventDefault();
                if (highlightedIndex >= 0) selectStock(matches[highlightedIndex]);
            } else if (event.key === "Escape") {
                closeDropdown();
            }
        });

        form.addEventListener("submit", (event) => event.preventDefault());
        document.addEventListener("click", (event) => {
            if (!form.contains(event.target)) closeDropdown();
        });
    })();

    // ==========================================
    // Notification Bell
    // ==========================================
    let notifOpen = false;
    let notifLoaded = false;

    function toggleNotifications() {
        const dropdown = document.getElementById("notifDropdown");
        notifOpen = !notifOpen;
        dropdown.style.display = notifOpen ? "block" : "none";
        if (notifOpen && !notifLoaded) loadNotifications();
    }

    document.addEventListener("click", (e) => {
        const bell = document.getElementById("notifBell");
        const dropdown = document.getElementById("notifDropdown");
        if (bell && dropdown && !bell.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.style.display = "none";
            notifOpen = false;
        }
    });

    async function loadNotifications() {
        const list = document.getElementById("notifList");
        const badge = document.getElementById("notifBadge");
        try {
            const res = await fetch("/user/notifications");
            const data = await res.json();
            const notifications = data.notifications || [];

            if (!notifications.length) {
                list.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">No new notifications</div>`;
                return;
            }

            badge.textContent = notifications.length;
            badge.style.display = "block";

            list.innerHTML = notifications.map(n => `
                <div style="padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; gap: 10px; align-items: flex-start;">
                    <span style="font-size: 18px;">${n.icon}</span>
                    <div>
                        <p style="margin: 0; font-size: 13px; color: var(--text-main); font-weight: 500;">${n.title}</p>
                        <p style="margin: 2px 0 0; font-size: 12px; color: var(--text-muted);">${n.message}</p>
                    </div>
                </div>
            `).join("");

            notifLoaded = true;
        } catch (e) {
            list.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Could not load notifications</div>`;
        }
    }

    function clearNotifications() {
        const list = document.getElementById("notifList");
        const badge = document.getElementById("notifBadge");
        list.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">No new notifications</div>`;
        badge.style.display = "none";
        notifLoaded = true;
    }
</script>
